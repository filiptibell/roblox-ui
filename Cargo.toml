[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.3"
edition = "2021"
description = "A frontend for Roblox projects"
keywords = ["cli", "async"]
categories = ["asynchronous"]
repository = "https://github.com/filiptibell/roblox-ui"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
# Internal crates
roblox-ui-http = { path = "crates/roblox-ui-http" }
roblox-ui-util = { path = "crates/roblox-ui-util" }
roblox-ui-reflection = { path = "crates/roblox-ui-reflection" }
roblox-ui-classes = { path = "crates/roblox-ui-classes" }
roblox-ui-data = { path = "crates/roblox-ui-data" }
roblox-ui-icons = { path = "crates/roblox-ui-icons" }
roblox-ui-project = { path = "crates/roblox-ui-project" }
roblox-ui-server = { path = "crates/roblox-ui-server" }

# External crates
ahash = "0.8"
anyhow = "1.0"
bytes = "1.11"
const_format = "0.2"
path-clean = "1.0"
quick-xml = "0.40"
semver = "1.0"
strsim = "0.11"
thiserror = "2.0"
usvg = "0.47"

strum = { version = "0.28", features = ["derive"] }
url = { version = "2.5", features = ["serde"] }
ustr = { version = "1.1", features = ["serde"] }

serde = { version = "1.0", features = ["rc", "derive"] }
serde_with = "3.20"
serde_json = "1.0"

# Async runtime (smol / async-* ecosystem, matching lune-org/lune)
async-global-executor = { version = "3.1", features = ["async-io"] }
async-channel = "2.5"
async-lock = "3.4"
async-io = "2.6"
async-net = "2.0"
async-fs = "2.2"
async-process = "2.3"
blocking = "1.6"
futures-lite = "2.6"
futures = { version = "0.3", default-features = false, features = ["std"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client stack (hyper, matching lune-org/lune)
hyper = { version = "1.10", default-features = false, features = ["http1", "client"] }
http-body-util = "0.1"
futures-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = "1.14"
webpki-roots = "1.0"

rbx_dom_weak = "4.1"
rbx_binary = "2.0"
rbx_xml = "2.0"
rbx_reflection = "6.1"
rbx_reflection_database = "2.0"

glob = "0.3"
tempfile = "3.14"

notify = { version = "8.2", default-features = false }
notify-debouncer-full = { version = "0.7", default-features = false }

clap = { version = "4.6", features = ["derive", "env"] }

zip = { version = "8.6", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
