[package]
name = "roblox-ui"
version = "0.3.3"
edition = "2021"
description = "A frontend for Roblox projects"
keywords = ["cli", "async"]
categories = ["asynchronous"]
repository = "https://github.com/filiptibell/roblox-ui"
license = "MPL-2.0"
publish = false

[[bin]]
name = "roblox-ui"
path = "src/main.rs"

[profile.release]
opt-level = "z"
strip = true
lto = true

[dependencies]
ahash = "0.8"
anyhow = "1.0"
bytes = "1.0"
const_format = "0.2"
path-clean = "1.0"
quick-xml = "0.37"
rayon = "1.8.0"
semver = "1.0"
strsim = "0.11"
thiserror = "2.0"
usvg = "0.37"

strum = { version = "0.26", features = ["derive"] }
url = { version = "2.4", features = ["serde"] }
ustr = { version = "1.0", features = ["serde"] }

serde = { version = "1.0", features = ["rc"] }
serde_with = "3.4"
serde_json = "1.0"
toml = "0.8"

futures = "0.3"
tokio = { version = "1.34", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
command-group = { version = "5.0", features = ["with-tokio"] }

rbx_dom_weak = { git = "https://github.com/rojo-rbx/rbx-dom", rev = "8e750dcc37b68a76b854edc3bcbe17896d72a6a1" }
rbx_reflection = { git = "https://github.com/rojo-rbx/rbx-dom", rev = "8e750dcc37b68a76b854edc3bcbe17896d72a6a1" }
rbx_reflection_database = { git = "https://github.com/rojo-rbx/rbx-dom", rev = "8e750dcc37b68a76b854edc3bcbe17896d72a6a1" }

[dependencies.notify]
version = "7.0"
default-features = false

[dependencies.notify-debouncer-full]
version = "0.4"
default-features = false

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "gzip"]

[dependencies.clap]
version = "4.4"
features = ["derive", "env"]

[dependencies.zip]
version = "2.1"
default-features = false
features = ["deflate", "bzip2", "zstd"]
